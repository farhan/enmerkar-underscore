[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "enmerkar-underscore"
dynamic = ["version"]
description = "Implements a underscore extractor for django-babel."
readme = "README.rst"
requires-python = ">=3.12"
license = "BSD-3-Clause"
authors = [
    {name = "edX", email = "oscm@edx.org"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
keywords = ["enmerkar-underscore"]
dependencies = [
    "django",
    "babel>=1.3",
    "enmerkar==0.7.1",
    "setuptools",
]

[project.urls]
Repository = "https://github.com/openedx/enmerkar-underscore"

[project.entry-points."babel.extractors"]
underscore = "enmerkar_underscore:extract"

[dependency-groups]
# Base test packages, no Django version pinned
test-base = [
    "coverage",
    "pytest",
    "pytest-cov",
    "python-coveralls",
    "sphinx",
]
# Default test group: current supported Django version
test = [
    {include-group = "test-base"},
    "Django>=5.2,<6.0",
]
# Django 4.2 support
django42 = [
    {include-group = "test-base"},
    "Django>=4.2,<5.0",
]
django52 = [
    {include-group = "test-base"},
    "Django>=5.2,<6.0",
]
quality = [
    "flake8>=2.0",
]
doc = [
    {include-group = "test"},
    "sphinx",
]
ci = [
    "tox",
    "tox-uv",
]
dev = [
    {include-group = "test"},
    {include-group = "quality"},
    {include-group = "doc"},
    {include-group = "ci"},
]

[tool.uv]
package = true
conflicts = [
    [
        {group = "test"},
        {group = "django42"},
        {group = "django52"},
    ],
]
constraint-dependencies = [
    "Django<6.0",
    "elasticsearch<7.14.0",
    "setuptools<71",
]

[tool.edx_lint]
uv_constraints = ["setuptools<71"]

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*", "*.tests", "*.tests.*", "docs*"]

[tool.setuptools_scm]
version_scheme = "only-version"
local_scheme = "no-local-version"

[tool.coverage.run]
branch = true
source_pkgs = ["enmerkar_underscore"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.semantic_release]
build_command = "pip install build && SETUPTOOLS_SCM_PRETEND_VERSION=$NEW_VERSION python -m build"
