[tox]
envlist = py312-django{42,52}, quality, docs
requires = tox-uv>=1

[testenv]
runner = uv-venv-lock-runner
dependency_groups =
    django42: django42
    django52: django52
commands =
    python -Wd -m pytest --cov=enmerkar_underscore --cov-report=xml {posargs}

[testenv:quality]
runner = uv-venv-lock-runner
dependency_groups = quality
commands =
    flake8 src tests

[testenv:docs]
runner = uv-venv-lock-runner
basepython = python3.12
dependency_groups = doc
allowlist_externals = make
changedir = {toxinidir}/docs
commands =
    make html
